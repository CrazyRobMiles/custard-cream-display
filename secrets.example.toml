# Secrets for custard-cream-display.
#
# Copy this file to `secrets.toml` (same folder) and fill in your own values:
#
#     copy secrets.example.toml secrets.toml        (Windows)
#     cp secrets.example.toml secrets.toml          (Linux/macOS)
#
# `secrets.toml` is listed in .gitignore, so it is never committed. This
# example file is committed, so never put real passwords in it.
#
# The build script (build.rs) reads `secrets.toml` when the firmware is
# compiled and bakes the values into the program. Change it and rebuild to
# update the frame. Anyone with the firmware binary, or physical access to the
# board's flash, can read these values, so use a network you are happy to
# share with the frame.

# One `[[wifi]]` section per network. The frame tries them in order and uses
# the first one it can join, so you can list home, office and phone hotspot.
# At least one network is required.
#
#   ssid      The network name (up to 32 bytes). Case-sensitive.
#   password  WPA/WPA2 passphrase, 8-63 characters. Use "" for an open
#             network. WPA3-only networks are not supported by the Wi-Fi
#             driver yet; WPA2/WPA3 "transition" networks work.

[[wifi]]
ssid = "my-home-network"
password = "my-wifi-password"

# [[wifi]]
# ssid = "my-phone-hotspot"
# password = "another-password"
